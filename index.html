<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOPPEBA KOARMADA RI - Sistem Informasi Personel</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style>
@media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; left: 0; top: 0; width: 100%; display: block; }
    #printTable th, #printTable td { border: 1px solid black; padding: 4px; text-align: center; }
    thead { display: table-header-group; }
}
</style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
    <style>
        :root {
            --accent-gold: #d4a853;
            --accent-navy: #0c2d4d;
            --accent-blue: #1e5f8a;
            --header-gray: #4a5568;
        }
        * { font-family: 'Poppins', sans-serif; box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; overflow-x: hidden; }
        .font-display { font-family: 'Playfair Display', serif; }
        .military-bg { background: linear-gradient(135deg, #0a0f1a 0%, #0c2d4d 30%, #1e5f8a 60%, #0c2d4d 80%, #0a0f1a 100%); position: relative; overflow: hidden; }
        .login-card { background: linear-gradient(145deg, rgba(12,45,77,0.95) 0%, rgba(10,30,50,0.98) 100%); border: 1px solid rgba(212,168,83,0.3); box-shadow: 0 0 60px rgba(212,168,83,0.1); }
        .input-field { transition: all 0.3s ease; border: 1px solid rgba(212,168,83,0.3); background: rgba(255,255,255,0.05); color: white; }
        .input-field:focus { border-color: var(--accent-gold); background: rgba(255,255,255,0.1); outline: none; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-gold) 0%, #b8943f 100%); color: #0c2d4d; font-weight: 700; transition: all 0.3s ease; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(212,168,83,0.3); color: var(--accent-gold); }
        .dashboard-bg { background: linear-gradient(135deg, #0a0f1a 0%, #0c2d4d 50%, #0a0f1a 100%); min-height: 100vh; }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(212,168,83,0.2); }
        .data-table th { background: linear-gradient(180deg, #1a202c 0%, #2d3748 100%); color: var(--accent-gold); font-size: 11px; padding: 12px 8px; position: sticky; top: 0; z-index: 20; border-bottom: 2px solid var(--accent-gold); }
        .data-table td { padding: 10px 8px; border-bottom: 1px solid rgba(212,168,83,0.1); font-size: 11px; color: #e0e0e0; background: rgba(12,45,77,0.3); }
        .action-btn { padding: 6px 10px; border-radius: 4px; font-size: 10px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
        .btn-sisip { color: #3b82f6; border-color: #3b82f6; }
        .btn-biodata { color: #10b981; border-color: #10b981; }
        .btn-edit { color: var(--accent-gold); border-color: var(--accent-gold); }
        .btn-hapus { color: #ef4444; border-color: #ef4444; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: linear-gradient(145deg, #0c2d4d 0%, #0a0f1a 100%); border: 1px solid rgba(212,168,83,0.3); border-radius: 8px; max-width: 1200px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .photo-container { width: 150px; height: 200px; border: 2px dashed rgba(212,168,83,0.5); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: rgba(255,255,255,0.02); }
        .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 8px; color: white; z-index: 9999; transform: translateX(150%); transition: transform 0.4s; }
        .toast.show { transform: translateX(0); }
        .toast-success { background: #047857; }
        .toast-error { background: #b91c1c; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(10,15,26,0.9); display: none; align-items: center; justify-content: center; z-index: 9998; flex-direction: column; gap: 20px; }
        .loading-overlay.active { display: flex; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(212,168,83,0.2); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="toast" class="toast" role="alert"></div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p class="text-[#d4a853] font-medium">Memproses...</p>
    </div>

    <!-- Halaman Login -->
    <div id="loginPage" class="military-bg min-h-screen flex items-center justify-center p-4">
        <div class="login-card rounded-lg p-8 md:p-10 w-full max-w-md relative z-10">
            <div class="flex justify-center mb-6">
                <img src="logo.png" alt="Logo KOPPEBA" style="width:150px; height:auto; filter: drop-shadow(0 0 12px rgba(212,168,83,0.7));">
            </div>
            <div class="text-center mb-8">
                <h1 class="font-display text-2xl md:text-3xl font-bold text-white mb-2">KOPPEBA</h1>
                <p class="text-[#d4a853] font-medium text-sm tracking-widest">KOARMADA RI</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Nama Pengguna</label>
                    <input type="text" id="username" class="input-field w-full px-4 py-3 rounded-lg text-sm" placeholder="Masukkan nama pengguna" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Kata Sandi</label>
                    <input type="password" id="password" class="input-field w-full px-4 py-3 rounded-lg text-sm" placeholder="Masukkan kata sandi" required>
                </div>
                <button type="submit" class="btn-primary w-full py-3.5 rounded-lg text-sm tracking-wider">MASUK</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardPage" class="dashboard-bg hidden min-h-screen">
        <header class="bg-[#0a0f1a]/95 border-b border-[#d4a853]/30 sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
            <h1 class="font-display text-lg font-bold text-white">KOPPEBA KOARMADA RI</h1>
            <button id="logoutBtn" class="px-4 py-2 rounded border border-red-500/50 text-red-400 text-sm">KELUAR</button>
        </header>
        <main class="px-4 py-4">
            <div class="glass-card rounded-lg p-3 mb-4 flex flex-wrap gap-2">
                <button id="addDataBtn" class="btn-primary px-4 py-2 rounded text-sm">Tambah</button>
                <button id="statistikBtn" class="btn-secondary px-4 py-2 rounded text-sm">Statistik</button>
                <button id="historyBtn" class="btn-secondary px-4 py-2 rounded text-sm">Riwayat</button>
                <button id="importBtn" class="btn-secondary px-4 py-2 rounded text-sm">Import Excel</button>
                <button id="backupBtn" class="btn-secondary px-4 py-2 rounded text-sm">Backup</button>
                <button id="restoreBtn" class="btn-secondary px-4 py-2 rounded text-sm">Restore</button>
                <button id="printReportBtn" class="btn-secondary px-4 py-2 rounded text-sm">Cetak</button>
                <button id="exportPdfBtn" class="btn-secondary px-4 py-2 rounded text-sm">PDF</button>
                <button id="exportWordBtn" class="btn-secondary px-4 py-2 rounded text-sm">Word</button>
                <button id="exportExcelBtn" class="btn-secondary px-4 py-2 rounded text-sm">Excel</button>
                <input type="text" id="searchInput" class="px-3 py-2 rounded bg-white/5 border border-white/10 text-white text-sm" placeholder="Cari...">
            </div>
            <div class="glass-card rounded-lg overflow-hidden">
                <table class="data-table w-full">
                    <thead>
                        <tr>
                            <th>No</th><th>Nama</th><th>Pangkat/Korps/NRP</th><th>Jabatan</th><th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
                <p id="emptyMessage" class="text-center text-gray-500 py-8 hidden">Tidak ada data personel</p>
            </div>
        </main>
    </div>

    <!-- Modal Form -->
    <div id="formModal" class="modal-overlay">
        <div class="modal-content p-6">
            <h2 id="formTitle" class="text-xl font-bold text-[#d4a853] mb-4">Tambah Data Personel</h2>
            <form id="dataForm" class="space-y-4">
                <input type="hidden" id="editId">
                <div class="flex flex-col items-center">
                    <div id="photoContainer" class="photo-container mb-2">
                        <span id="photoPlaceholder" class="text-xs text-gray-400">Upload Foto</span>
                        <img id="photoPreview" class="hidden w-full h-full object-cover">
                    </div>
                    <input type="file" id="photoInput" accept="image/*" class="hidden">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Nama</label>
                    <input type="text" id="nama" class="w-full px-3 py-2 rounded bg-white/5 border border-white/10 text-white text-sm" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Pangkat/Korps/NRP</label>
                    <input type="text" id="pangkatKorpsNrp" class="w-full px-3 py-2 rounded bg-white/5 border border-white/10 text-white text-sm" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Jabatan</label>
                    <input type="text" id="jabatan" class="w-full px-3 py-2 rounded bg-white/5 border border-white/10 text-white text-sm" required>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary px-6 py-2 rounded text-sm">SIMPAN</button>
                    <button type="button" id="closeFormModal" class="px-6 py-2 rounded bg-white/5 text-gray-400 text-sm">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <input type="file" id="importInput" accept=".xlsx,.xls" class="hidden">
    <input type="file" id="restoreInput" accept=".json" class="hidden">

    <script>
        const VALID_PASSWORD = "123";
        const DB_NAME = 'KOPPEBA_DB_V10';
        let db = null, allData = [], currentPhoto = '';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 2);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => { db = request.result; resolve(db); };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains('personel')) database.createObjectStore('personel', { keyPath: 'id', autoIncrement: true });
                };
            });
        }

        const showToast = (msg, type = 'success') => {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (document.getElementById('password').value !== VALID_PASSWORD) {
                showToast('Kata sandi salah!', 'error');
                return;
            }
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.remove('hidden');
            await loadData();
            showToast('Login berhasil');
        });

        async function loadData() {
            const tx = db.transaction(['personel'], 'readonly');
            const store = tx.objectStore('personel');
            const req = store.getAll();
            req.onsuccess = () => {
                allData = req.result;
                renderTable(allData);
            };
        }

        function renderTable(data) {
            const tbody = document.getElementById('dataTableBody');
            document.getElementById('emptyMessage').classList.toggle('hidden', data.length > 0);
            tbody.innerHTML = data.map((item, i) => `
                <tr>
                    <td class="text-center">${i + 1}</td>
                    <td>${item.nama || '-'}</td>
                    <td>${item.pangkatKorpsNrp || '-'}</td>
                    <td>${item.jabatan || '-'}</td>
                    <td>
                        <button class="action-btn btn-edit" onclick="editData(${item.id})">Edit</button>
                        <button class="action-btn btn-hapus" onclick="hapusData(${item.id})">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('addDataBtn').addEventListener('click', () => {
            document.getElementById('formTitle').textContent = 'Tambah Data Personel';
            document.getElementById('dataForm').reset();
            document.getElementById('editId').value = '';
            currentPhoto = '';
            document.getElementById('photoPreview').classList.add('hidden');
            document.getElementById('photoPlaceholder').classList.remove('hidden');
            document.getElementById('formModal').classList.add('active');
        });

        document.getElementById('closeFormModal').addEventListener('click', () => {
            document.getElementById('formModal').classList.remove('active');
        });

        // Foto Handler
        document.getElementById('photoContainer').addEventListener('click', () => document.getElementById('photoInput').click());
        document.getElementById('photoInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    currentPhoto = ev.target.result;
                    const prev = document.getElementById('photoPreview');
                    prev.src = currentPhoto;
                    prev.classList.remove('hidden');
                    document.getElementById('photoPlaceholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const data = {
                nama: document.getElementById('nama').value,
                pangkatKorpsNrp: document.getElementById('pangkatKorpsNrp').value,
                jabatan: document.getElementById('jabatan').value,
                foto: currentPhoto
            };
            const tx = db.transaction(['personel'], 'readwrite');
            const store = tx.objectStore('personel');
            if (editId) {
                data.id = parseInt(editId);
                store.put(data);
            } else {
                store.add(data);
            }
            tx.oncomplete = async () => {
                showToast('Data berhasil disimpan');
                document.getElementById('formModal').classList.remove('active');
                await loadData();
            };
        });

        window.editData = (id) => {
            const item = allData.find(d => d.id === id);
            if (!item) return;
            document.getElementById('formTitle').textContent = 'Edit Data Personel';
            document.getElementById('editId').value = item.id;
            document.getElementById('nama').value = item.nama || '';
            document.getElementById('pangkatKorpsNrp').value = item.pangkatKorpsNrp || '';
            document.getElementById('jabatan').value = item.jabatan || '';
            currentPhoto = item.foto || '';
            if (currentPhoto) {
                const prev = document.getElementById('photoPreview');
                prev.src = currentPhoto;
                prev.classList.remove('hidden');
                document.getElementById('photoPlaceholder').classList.add('hidden');
            }
            document.getElementById('formModal').classList.add('active');
        };

        window.hapusData = async (id) => {
            if (confirm('Yakin ingin menghapus data ini?')) {
                const tx = db.transaction(['personel'], 'readwrite');
                tx.objectStore('personel').delete(id);
                tx.oncomplete = async () => {
                    showToast('Data berhasil dihapus');
                    await loadData();
                };
            }
        };

        // Tombol Export Excel / PDF / Word / Cetak
        document.getElementById('exportExcelBtn').addEventListener('click', () => {
            if (!allData.length) return alert('Tidak ada data');
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(allData);
            XLSX.utils.book_append_sheet(wb, ws, "Personel");
            XLSX.writeFile(wb, "Data_Personel.xlsx");
        });

        document.getElementById('exportPdfBtn').addEventListener('click', () => {
            if (!allData.length) return alert('Tidak ada data');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("DATA PERSONEL KOPPEBA", 14, 15);
            doc.autoTable({
                startY: 25,
                head: [['No', 'Nama', 'Pangkat/NRP', 'Jabatan']],
                body: allData.map((d, i) => [i+1, d.nama, d.pangkatKorpsNrp, d.jabatan])
            });
            doc.save("Data_Personel.pdf");
        });

        document.getElementById('exportWordBtn').addEventListener('click', async () => {
            if (!allData.length) return alert('Tidak ada data');
            const rows = [
                new docx.TableRow({
                    children: ['No', 'Nama', 'Pangkat/NRP', 'Jabatan'].map(h => new docx.TableCell({ children: [new docx.Paragraph(h)] }))
                })
            ];
            allData.forEach((d, i) => {
                rows.push(new docx.TableRow({
                    children: [String(i+1), d.nama || '', d.pangkatKorpsNrp || '', d.jabatan || ''].map(c => new docx.TableCell({ children: [new docx.Paragraph(c)] }))
                }));
            });
            const doc = new docx.Document({ sections: [{ children: [new docx.Table({ rows })] }] });
            const blob = await docx.Packer.toBlob(doc);
            saveAs(blob, "Data_Personel.docx");
        });

        document.getElementById('printReportBtn').addEventListener('click', () => {
            window.print();
        });

        initDB();
    </script>
</body>
</html>
